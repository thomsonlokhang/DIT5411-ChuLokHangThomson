# RTX 5070 Ti (16 GB, Blackwell). One model uses the whole card.
# Train with:  python scripts/train_all.py --data-dir "data/cleaned_data(50_50)"
#
# The first 40 images per character stay the training pool, and each epoch
# still shows 200 augmented views of every full class. That pass is not
# shortened to force a clock time.
#
# On the 4,803-class common set this is about 960,000 views. custom_cnn at
# batch 1024 is about 940 steps, which is the pass aimed at one minute
# after epoch 1 has compiled the graph. The full 13,065-class set is about
# 2.7 times that work, so expect about 2 to 4 minutes for custom_cnn and
# longer for EfficientNet. Pass that folder with --data-dir for the result
# the assignment asks for (13,065 output neurons).
data_dir: data/cleaned_data(50_50)
output_dir: runs
model: custom_cnn
image_size: 64
batch_size: 256
epochs: 15
patience: 4
learning_rate: 0.004
seed: 5411

train_per_class: 40
val_ratio: 0.0
target_samples_per_class: 200
max_classes: null
classes_file: null

weights: imagenet
freeze_base: false
cache: memory
shuffle_buffer: 65536

# GPU math uses few host threads. The input pipeline gets its own pool.
cpu_threads: 8
inter_op_threads: 4
input_threads: 8
deterministic: false

gpu_performance: true
jit_compile: true
augment_on_gpu: true
drop_remainder: true
target_epoch_seconds: 60

# Sqrt batch scaling from the laptop baseline (batch 32, lr 0.001 for the
# CNNs, lr 0.0001 when fine-tuning an ImageNet network).
model_overrides:
  custom_cnn:
    batch_size: 1024
    learning_rate: 0.004
  residual_cnn:
    batch_size: 768
    learning_rate: 0.004
  mobilenet_v2:
    batch_size: 256
    learning_rate: 0.0003
  efficientnet_b0:
    batch_size: 128
    learning_rate: 0.0002
  mobilenet_v3_small:
    batch_size: 256
    learning_rate: 0.0003

augmentation:
  rotation_degrees: 15
  translation: 0.10
  zoom: 0.15
  scale: 0.10
  shear_x: 0.25
  shear_y: 0.15
  # Half of each batch stays upright. The test images are upright.
  # Rotation stays on. See the report generator for why.
  clean_probability: 0.5
