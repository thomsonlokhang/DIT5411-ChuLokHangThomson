# Short run for the AMD Ryzen AI laptop. Confirms the pipeline before a full train.
data_dir: data/cleaned_data
output_dir: runs
model: custom_cnn
image_size: 48
batch_size: 16
epochs: 3
patience: 2
learning_rate: 0.001
seed: 5411
train_per_class: 40
val_ratio: 0.0
target_samples_per_class: 80
max_classes: 20
classes_file: null
weights: none
freeze_base: true
cache: memory
shuffle_buffer: 4096

augmentation:
  rotation_degrees: 15
  translation: 0.10
  zoom: 0.15
  scale: 0.10
  shear_x: 0.25
  shear_y: 0.15
